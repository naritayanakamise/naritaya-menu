    let currentLang = 'ja';

    function adjustSpacer() {
      const header = document.getElementById('main-header');
      const spacer = document.getElementById('content-spacer');
      if (header && spacer) {
        spacer.style.height = `${header.offsetHeight + 14}px`;
      }
    }

    function setLanguage(lang) {
      if (currentLang === lang) return;
      currentLang = lang;

      const btnJa = document.getElementById('btn-lang-ja');
      const btnEn = document.getElementById('btn-lang-en');
      const appTitle = document.getElementById('app-title');
      const taxLabel = document.getElementById('tax-label');
      const orderWarning = document.getElementById('order-warning');
      const searchInput = document.getElementById('search-input');
      const subCatch = document.getElementById('sub-catch');
      const photoHint = document.getElementById('photo-hint');

      if (lang === 'ja') {
        btnJa.className = "px-3 py-1 rounded-full text-xs font-bold transition-all bg-stone-900 text-white shadow-sm";
        btnEn.className = "px-3 py-1 rounded-full text-xs font-bold text-stone-700 hover:text-stone-950 transition-all";
        appTitle.textContent = "成田家 お品書き";
        taxLabel.textContent = "税込";
        subCatch.textContent = "岡山・表町 伝統の大衆酒場";
        photoHint.innerHTML = `<i data-lucide="image" class="w-3.5 h-3.5 text-sky-600 shrink-0"></i><span>料理名タップで写真表示</span>`;
        orderWarning.innerHTML = `<i data-lucide="info" class="w-3.5 h-3.5 text-amber-800 shrink-0"></i><span>ご注文は直接スタッフまでお申し付けください</span>`;
        searchInput.placeholder = "料理名・ひらがな・価格で検索 (例: とりす, ゆどうふ, 280)";
      } else {
        btnEn.className = "px-3 py-1 rounded-full text-xs font-bold transition-all bg-stone-900 text-white shadow-sm";
        btnJa.className = "px-3 py-1 rounded-full text-xs font-bold text-stone-700 hover:text-stone-950 transition-all";
        appTitle.textContent = "Naritaya Menu";
        taxLabel.textContent = "Tax incl.";
        subCatch.textContent = "Omotecho, Okayama - Traditional Pub";
        photoHint.innerHTML = `<i data-lucide="image" class="w-3.5 h-3.5 text-sky-600 shrink-0"></i><span>Tap item to view photo</span>`;
        orderWarning.innerHTML = `<i data-lucide="info" class="w-3.5 h-3.5 text-amber-800 shrink-0"></i><span>Please place orders directly with staff</span>`;
        searchInput.placeholder = "Search dishes or prices (e.g. Tori-su, 280)";
      }

      renderMenu();
      renderCategoryTabs();
      lucide.createIcons();
      adjustSpacer();
    }

    function renderCategoryTabs() {
      const tabsContainer = document.getElementById('category-tabs');
      tabsContainer.innerHTML = '';
      const data = currentLang === 'ja' ? menuDataJa : menuDataEn;

      data.forEach((cat, index) => {
        const catId = `cat-section-${index}`;
        const pill = document.createElement('button');
        pill.id = `pill-${catId}`;
        
        pill.className = `toc-pill shrink-0 px-3.5 py-1.5 rounded-full text-xs font-sans font-bold transition-all duration-150 border ${
          cat.isDrink 
            ? 'bg-amber-100/90 text-amber-950 border-amber-300 hover:bg-amber-200' 
            : 'bg-white text-stone-800 border-stone-300 shadow-sm hover:bg-stone-100 hover:border-stone-400'
        }`;
        pill.textContent = cat.category;
        pill.onclick = (e) => {
          e.preventDefault();
          scrollToCategory(catId);
        };
        tabsContainer.appendChild(pill);
      });
    }

    function scrollToCategory(id) {
      const target = document.getElementById(id);
      const header = document.getElementById('main-header');
      if (!target || !header) return;

      const offsetPosition = target.getBoundingClientRect().top + window.pageYOffset - header.offsetHeight - 16;
      window.scrollTo({
        top: offsetPosition,
        behavior: 'smooth'
      });
    }

    // 検索処理（漢字、ひらがな、カタカナ、英数字を正規化して判定）
    function renderMenu() {
      const container = document.getElementById('menu-container');
      container.innerHTML = '';
      const data = currentLang === 'ja' ? menuDataJa : menuDataEn;

      const rawTerm = currentSearchTerm.trim().toLowerCase();
      const hiraTerm = toHiragana(rawTerm); // ひらがな統一版

      let matchedItemsCount = 0;

      data.forEach((categoryData, catIdx) => {
        const catId = `cat-section-${catIdx}`;
        
        const filteredItems = categoryData.items.filter(item => {
          if (!rawTerm) return true;

          const nameLower = item.name.toLowerCase();
          const nameHira = toHiragana(nameLower);
          const priceLower = item.price.toLowerCase();
          const kanaLower = (item.kana || '').toLowerCase();
          const kanaHira = toHiragana(kanaLower);

          return (
            nameLower.includes(rawTerm) ||
            nameHira.includes(hiraTerm) ||
            priceLower.includes(rawTerm) ||
            kanaLower.includes(rawTerm) ||
            kanaHira.includes(hiraTerm)
          );
        });

        if (filteredItems.length === 0) return;
        matchedItemsCount += filteredItems.length;

        const section = document.createElement('section');
        section.id = catId;
        section.className = "scroll-mt-48 transition-all";

        const headerDiv = document.createElement('div');
        headerDiv.className = "flex items-center justify-between border-b-2 border-stone-800 pb-2 mb-3 pt-2";

        const titleSpan = document.createElement('h2');
        titleSpan.className = "font-serif text-lg sm:text-xl font-bold text-stone-950 tracking-wider flex items-center gap-2";

        // ★言語に応じて「ドリンク/DRINK」「料理/FOOD」を切り替え
        const drinkLabel = currentLang === 'ja' ? 'ドリンク' : 'DRINK';
        const foodLabel = currentLang === 'ja' ? '料理' : 'FOOD';

        const badgeTag = categoryData.isDrink 
          ? `<span class="text-[11px] font-sans px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-900 border border-amber-300 font-bold tracking-normal">${drinkLabel}</span>`
          : `<span class="text-[11px] font-sans px-2.5 py-0.5 rounded-full bg-stone-200 text-stone-800 border border-stone-300 font-bold tracking-normal">${foodLabel}</span>`;

        titleSpan.innerHTML = `<span>${categoryData.category}</span> ${badgeTag}`;
        headerDiv.appendChild(titleSpan);
        section.appendChild(headerDiv);

        if (categoryData.category === "やきとり") {
          const yakitoriNote = document.createElement('div');
          yakitoriNote.className = "mb-3 px-3 py-1.5 rounded-lg bg-red-50 border border-red-200 text-xs text-red-700 font-bold flex items-center gap-1.5";
          yakitoriNote.innerHTML = `<i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i><span>それぞれ二本からになります</span>`;
          section.appendChild(yakitoriNote);
        } else if (categoryData.category === "Yakitori") {
          const yakitoriNote = document.createElement('div');
          yakitoriNote.className = "mb-3 px-3 py-1.5 rounded-lg bg-red-50 border border-red-200 text-xs text-red-700 font-bold flex items-center gap-1.5";
          yakitoriNote.innerHTML = `<i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i><span>※Minimum order of 2 skewers per item.</span>`;
          section.appendChild(yakitoriNote);
        }

        const itemsWrapper = document.createElement('div');
        itemsWrapper.className = "bg-white rounded-2xl border border-stone-300 shadow-sm divide-y divide-stone-200 overflow-hidden";

        filteredItems.forEach(item => {
          const row = document.createElement('div');
          row.className = "touch-item";

          if (categoryData.isDrink) {
            row.className += " p-4 flex items-center justify-between cursor-default";
            row.innerHTML = `
              <div class="flex items-center gap-2">
                <span class="font-sans text-sm sm:text-base font-bold text-stone-900">${item.name}</span>
              </div>
              <div class="font-serif font-bold text-base sm:text-lg text-stone-950 whitespace-nowrap pl-4">
                ${item.price}
              </div>
            `;
          } else {
            const isSpecialty = item.name.includes("★");
            const hasFeaturedThumbnail = item.isFeatured && item.image;

            row.className += " p-4 flex flex-col gap-2.5 cursor-pointer";
            row.onclick = () => openPhotoModal(item.name, item.price, item.image);

            let thumbnailHtml = '';
            if (hasFeaturedThumbnail) {
              thumbnailHtml = `
                <div class="mt-2 w-full flex justify-center">
                  <div class="relative group/thumb overflow-hidden rounded-xl border border-stone-300 shadow-sm w-44 aspect-square bg-stone-100">
                    <img 
                      src="${item.image}" 
                      alt="${item.name}" 
                      loading="lazy" 
                      class="w-full h-full object-cover transition-transform duration-300 group-hover/thumb:scale-105"
                      onerror="this.src='https://placehold.co/200x200/f3f4f6/9ca3af?text=Naritaya'"
                    >
                    <div class="absolute bottom-1.5 right-1.5 bg-stone-950/80 text-white font-bold text-[10px] px-2.5 py-0.5 rounded-full flex items-center gap-1 shadow">
                      <i data-lucide="zoom-in" class="w-3 h-3"></i>
                      <span>写真拡大</span>
                    </div>
                  </div>
                </div>
              `;
            }

            row.innerHTML = `
              <div class="flex items-center justify-between gap-3">
                <div class="flex items-center gap-2 flex-wrap">
                  <span class="font-sans text-sm sm:text-base ${isSpecialty ? 'font-bold text-red-700' : 'font-bold text-stone-900'}">
                    ${item.name}
                  </span>
                  ${isSpecialty ? '<span class="text-[11px] bg-red-100 text-red-800 font-extrabold px-2 py-0.5 rounded border border-red-300">名物</span>' : ''}
                </div>
                <div class="flex items-center gap-2.5 shrink-0">
                  <span class="font-serif font-bold text-base sm:text-lg text-stone-950 whitespace-nowrap">
                    ${item.price}
                  </span>
                  <div class="w-7 h-7 rounded-full bg-stone-100 border border-stone-200 flex items-center justify-center text-stone-600 transition">
                    <i data-lucide="image" class="w-4 h-4"></i>
                  </div>
                </div>
              </div>
              ${thumbnailHtml}
            `;
          }

          itemsWrapper.appendChild(row);
        });

        section.appendChild(itemsWrapper);
        container.appendChild(section);
      });

      const statusBanner = document.getElementById('search-status');
      const statusText = document.getElementById('search-status-text');
      if (rawTerm) {
        statusBanner.classList.remove('hidden');
        statusText.innerHTML = currentLang === 'ja' 
          ? `「<strong class="text-stone-950 font-bold">${rawTerm}</strong>」の検索結果: <strong class="text-red-700 font-bold">${matchedItemsCount}</strong>品`
          : `Results for "<strong class="text-stone-950 font-bold">${rawTerm}</strong>": <strong class="text-red-700 font-bold">${matchedItemsCount}</strong> items`;
      } else {
        statusBanner.classList.add('hidden');
      }

      if (matchedItemsCount === 0 && rawTerm) {
        container.innerHTML = `
          <div class="py-16 text-center text-stone-500 bg-white rounded-2xl border border-stone-300 p-8 shadow-sm">
            <i data-lucide="search-x" class="w-12 h-12 mx-auto stroke-1 mb-3 text-stone-400"></i>
            <p class="font-serif text-base font-bold text-stone-800 mb-1">
              ${currentLang === 'ja' ? '該当するメニューが見つかりませんでした' : 'No menu items found'}
            </p>
            <p class="text-xs text-stone-500">
              ${currentLang === 'ja' ? 'ひらがな、カタカナ、または価格（例: 280）で再検索してください' : 'Please check your spelling or search by another keyword'}
            </p>
          </div>
        `;
      }
    }

    function openPhotoModal(dishName, price, imageSrc) {
      const modal = document.getElementById('photo-overlay');
      const modalImg = document.getElementById('modal-image');
      const modalName = document.getElementById('modal-dish-name');
      const modalPrice = document.getElementById('modal-dish-price');
      const fallbackBox = document.getElementById('image-fallback');
      const fallbackTitle = document.getElementById('fallback-dish-title');
      const noteBox = document.getElementById('modal-dish-note');
      const noteText = document.getElementById('modal-dish-note-text');

      modalName.textContent = dishName;
      modalPrice.textContent = price;
      fallbackTitle.textContent = dishName;

      // 刺身盛合せ・天ぷら盛合せ専用注意書き
      const isVariableItem = 
        dishName.includes("刺身盛合せ") || 
        dishName.includes("天ぷら盛合せ") ||
        dishName.includes("Assorted Sashimi") ||
        dishName.includes("Assorted Tempura");

      if (isVariableItem) {
        noteBox.classList.remove('hidden');
        if (currentLang === 'ja') {
          noteText.textContent = "※仕入れや季節により内容・器が変わる場合がございます。";
        } else {
          noteText.textContent = "※Contents and tableware may vary depending on seasonal catch and availability.";
        }
      } else {
        noteBox.classList.add('hidden');
      }

      fallbackBox.classList.add('hidden');
      modalImg.style.display = 'block';
      modalImg.src = imageSrc || '';

      modal.classList.remove('opacity-0', 'pointer-events-none');
      const innerCard = modal.querySelector('div');
      innerCard.classList.remove('scale-95');
      innerCard.classList.add('scale-100');

      document.body.style.overflow = 'hidden';
      lucide.createIcons();
    }

    function closePhotoModal() {
      const modal = document.getElementById('photo-overlay');
      const innerCard = modal.querySelector('div');
      innerCard.classList.remove('scale-100');
      innerCard.classList.add('scale-95');

      modal.classList.add('opacity-0', 'pointer-events-none');
      document.body.style.overflow = '';
    }

    function handleImageFallback(imgElement) {
      imgElement.style.display = 'none';
      const fallback = document.getElementById('image-fallback');
      if (fallback) fallback.classList.remove('hidden');
    }

    function handleSearch(term) {
      currentSearchTerm = term;
      const clearBtn = document.getElementById('search-clear-btn');
      if (term.trim()) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }
      renderMenu();
      lucide.createIcons();
    }

    function clearSearch() {
      const searchInput = document.getElementById('search-input');
      searchInput.value = '';
      currentSearchTerm = '';
      document.getElementById('search-clear-btn').classList.add('hidden');
      renderMenu();
      lucide.createIcons();
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closePhotoModal();
    });

    function handleScrollSpy() {
      const sections = document.querySelectorAll('section[id^="cat-section-"]');
      const header = document.getElementById('main-header');
      const headerHeight = header ? header.offsetHeight : 160;
      const scrollPos = window.scrollY + headerHeight + 40;

      let currentActiveId = null;

      sections.forEach(section => {
        const top = section.offsetTop;
        const height = section.offsetHeight;
        if (scrollPos >= top && scrollPos < top + height) {
          currentActiveId = section.id;
        }
      });

      if (currentActiveId) {
        document.querySelectorAll('.toc-pill').forEach(pill => {
          pill.classList.remove('active-chip');
        });

        const activePill = document.getElementById(`pill-${currentActiveId}`);
        if (activePill) {
          activePill.classList.add('active-chip');
          activePill.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }
      }

      const backToTopBtn = document.getElementById('back-to-top');
      if (backToTopBtn) {
        if (window.scrollY > 400) {
          backToTopBtn.classList.remove('opacity-0', 'pointer-events-none');
          backToTopBtn.classList.add('opacity-100');
        } else {
          backToTopBtn.classList.add('opacity-0', 'pointer-events-none');
          backToTopBtn.classList.remove('opacity-100');
        }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderCategoryTabs();
      renderMenu();
      lucide.createIcons();
      adjustSpacer();

      setTimeout(handleScrollSpy, 100);

      window.addEventListener('resize', adjustSpacer);
      window.addEventListener('scroll', handleScrollSpy, { passive: true });
    });
  </script>
</body>
</html>
